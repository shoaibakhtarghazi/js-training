<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="input-area">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a task"
            >

            <button id="addBtn">Add</button>
        </div>

        <p id="emptyMessage">Your task list is empty.</p>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
